# Runs the containerised app. Overlay on docker-compose.yml — the infra services
# (postgres, prometheus, grafana, ...) come from there:
#
#   docker compose -f docker-compose.yml -f compose.prod.yml up --build
#   docker compose -f docker-compose.yml -f compose.prod.yml --profile seed up migrate seed
#
# Plain `docker compose up -d` is unaffected: it never reads this file.

x-app: &app
  build: .
  image: backend-devops-interview:local
  environment: &app-env
    DJANGO_SETTINGS_MODULE: core.settings
    SECRET_KEY: ${SECRET_KEY:-django-insecure-unsecure}
    DEBUG: ${DEBUG:-False}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    POSTGRES_DB: ${POSTGRES_DB:-backend_devops_interview}
    POSTGRES_USER: ${POSTGRES_USER:-postgres}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # The app reaches Postgres over the Compose network, not the host mapping.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
  depends_on:
    postgres:
      condition: service_started

services:
  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"

  web:
    <<: *app
    command: ["gunicorn", "core.wsgi:application", "--config", "gunicorn.conf.py"]
    environment:
      <<: *app-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ~600k rows, a couple of minutes — opt in with `--profile seed`.
  seed:
    <<: *app
    command: ["python", "manage.py", "seed"]
    profiles: ["seed"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
