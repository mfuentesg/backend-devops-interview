apiVersion: 1

providers:
  - name: default
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      # Matches the bind mount in docker-compose.yml.
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
