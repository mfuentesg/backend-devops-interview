name: CI

on:
    push:
        branches: [main]
    pull_request:
        types: [opened, synchronize]

permissions:
    contents: read
    packages: write

jobs:
    lint-test:
        name: ruff + tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        services:
            # The suite is pytest-django with @pytest.mark.django_db; it needs a
            # real Postgres. Same image as docker-compose.yml; creds match the
            # core/settings.py Env(...) defaults so no test-step env is needed.
            postgres:
                image: postgres:18.6-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: backend_devops_interview
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up mise (python, uv, ruff — pinned in mise.toml)
              uses: jdx/mise-action@v2

            - name: Cache uv virtualenv
              uses: actions/cache@v4
              with:
                  path: .venv
                  key: venv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
                  restore-keys: |
                      venv-${{ runner.os }}-

            - name: Sync dependencies with uv (dev group)
              run: uv sync --group dev

            - name: Ruff lint
              run: ruff check .

            - name: Run tests
              run: uv run pytest -vv

