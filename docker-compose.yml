services:
  postgres:
    image: postgres:18.6-alpine
    ports:
      # Left side is the host port Django connects to (POSTGRES_PORT in .env);
      # the container always listens on 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    restart: always
    volumes:
      - db_data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-backend_devops_interview}

  pgexporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_URI: "postgres:5432/${POSTGRES_DB:-backend_devops_interview}?sslmode=disable"
      DATA_SOURCE_USER: "${POSTGRES_USER:-postgres}"
      DATA_SOURCE_PASS: "${POSTGRES_PASSWORD:-postgres}"
    depends_on:
      - postgres
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.7
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.19.2
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/app:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    container_name: grafana_ui
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Dashboards open without a login; editing still needs the admin user.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      # Datasource + dashboard-provider config, then the dashboard JSON itself.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: pgadmin_ui
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-postgres}
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "true"
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    configs:
      # Mounts your custom server JSON block into pgAdmin
      - source: servers_json
        target: /pgadmin4/servers.json
        mode: 0444
      # Mounts the automated password file with specific required POSIX permissions
      - source: pgpass_file
        target: /config/pgpass
        uid: "5050"
        gid: "5050"
        mode: 0400

volumes:
  db_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:

# Plain strings built inline from Docker Config blocks. Compose interpolates
# ${VAR} here at parse time, reading the project .env (real env vars win).
# Host/Port stay literal: pgAdmin reaches Postgres over the compose network as
# service "postgres" on the container port 5432, not the host's POSTGRES_HOST/PORT.
configs:
  servers_json:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "Local Postgres",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "${POSTGRES_DB:-backend_devops_interview}",
            "Username": "${POSTGRES_USER:-postgres}",
            "SSLMode": "prefer",
            "PassFile": "/config/pgpass"
          }
        }
      }

  pgpass_file:
    content: |
      postgres:5432:${POSTGRES_DB:-backend_devops_interview}:${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}
