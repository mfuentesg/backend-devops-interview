services:
  postgres:
    image: postgres:18.6-alpine
    ports:
      - 5432:5432
    restart: always
    volumes:
      - db_data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: backend_devops_interview

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_ui
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: postgres
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "true"
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    configs:
      # Mounts your custom server JSON block into pgAdmin
      - source: servers_json
        target: /pgadmin4/servers.json
        mode: 0444
      # Mounts the automated password file with specific required POSIX permissions
      - source: pgpass_file
        target: /config/pgpass
        uid: "5050"
        gid: "5050"
        mode: 0400

volumes:
  db_data:
  pgadmin_data:

# Defining plain strings inline using Docker Config blocks
configs:
  servers_json:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "Local Postgres",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "backend_devops_interview",
            "Username": "postgres",
            "SSLMode": "prefer",
            "PassFile": "/config/pgpass"
          }
        }
      }

  pgpass_file:
    content: |
      postgres:5432:backend_devops_interview:postgres:postgres
